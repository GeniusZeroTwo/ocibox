name: Java Build & Release

# 触发条件：当有代码推送到 main 或 master 分支时自动执行
on:
  push:
    branches: [ "main", "master" ]

# 防止两次快速推送并发抢占同一个 latest 标签/资产
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Verify Frontend Integrity
      run: python3 scripts/verify-frontend.py

    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Generate checksums and aliases
      run: |
        cd target
        if [ -f ocibox.jar ]; then
          cp -f ocibox.jar oci-personal.jar
        elif [ -f oci-personal.jar ]; then
          cp -f oci-personal.jar ocibox.jar
        else
          echo "No release JAR found" >&2
          exit 1
        fi
        sha256sum ocibox.jar oci-personal.jar > checksums.txt
        test -s checksums.txt

    - name: Upload release assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-assets
        path: |
          target/ocibox.jar
          target/oci-personal.jar
          target/checksums.txt
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-assets
        path: release-assets

    - name: Verify release assets
      run: |
        test -s release-assets/ocibox.jar
        test -s release-assets/oci-personal.jar
        test -s release-assets/checksums.txt

    - name: Get Current Time
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

    - name: Create Release & Upload JAR
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        tag_name: latest
        name: '🚀 最新自动编译版 (Latest)'
        body: |
          这是由 GitHub Actions 全自动构建的最新版本。
          **构建时间**: ${{ env.date }} UTC
        files: |
          release-assets/ocibox.jar
          release-assets/oci-personal.jar
          release-assets/checksums.txt
        make_latest: true
